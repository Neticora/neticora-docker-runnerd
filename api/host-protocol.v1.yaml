          }
        },
        "required": [
          "hostId",
          "keyId",
          "keyVersion",
          "sessionEpoch"
        ],
        "additionalProperties": false
      },
      "HostCapabilities": {
        "type": "object",
        "properties": {
          "host": {
            "$ref": "#/components/schemas/Platform"
          },
          "engine": {
            "$ref": "#/components/schemas/Platform"
          },
          "endpointIdentity": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "runtimeVersion": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "configurationGeneration": {
            "$ref": "#/components/schemas/Generation"
          },
          "probeGeneration": {
            "$ref": "#/components/schemas/Generation"
          },
          "observedAt": {
            "$ref": "#/components/schemas/Timestamp"
          },
          "profiles": {
            "type": "array",
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            },
            "maxItems": 32
          },
          "dockerBuild": {
            "type": "boolean"
          },
          "hardStorageLimit": {
            "type": "boolean"
          },
          "capacity": {
            "$ref": "#/components/schemas/ResourceBudget"
          },
          "supportedImageFamilies": {
            "type": "array",
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            },
            "maxItems": 64
          },
          "runtimeMechanism": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          }
        },
        "required": [
          "host",
          "engine",
          "endpointIdentity",
          "runtimeVersion",
          "configurationGeneration",
          "probeGeneration",
          "observedAt",
          "profiles",
          "dockerBuild",
          "hardStorageLimit",
          "capacity",
          "supportedImageFamilies",
          "runtimeMechanism"
        ],
        "additionalProperties": false
      },
      "HostHeartbeat": {
        "type": "object",
        "properties": {
          "identity": {
            "$ref": "#/components/schemas/HostIdentity"
          },
          "agentVersion": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "protocolVersion": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "inventoryGeneration": {
            "$ref": "#/components/schemas/Generation"
          },
          "effectivePolicyGeneration": {
            "$ref": "#/components/schemas/Generation"
          },
          "capabilities": {
            "$ref": "#/components/schemas/HostCapabilities"
          }
        },
        "required": [
          "identity",
          "agentVersion",
          "protocolVersion",
          "inventoryGeneration",
          "effectivePolicyGeneration",
          "capabilities"
        ],
        "additionalProperties": false
      },
      "LocalPolicy": {
        "type": "object",
        "properties": {
          "generation": {
            "$ref": "#/components/schemas/Generation"
          },
          "allowedTrustClasses": {
            "type": "array",
            "items": {
              "enum": [
                "trusted",
                "untrusted"
              ]
            },
            "maxItems": 2
          },
          "allowedProfiles": {
            "type": "array",
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            },
            "maxItems": 32
          },
          "limits": {
            "$ref": "#/components/schemas/ResourceBudget"
          }
        },
        "required": [
          "generation",
          "allowedTrustClasses",
          "allowedProfiles",
          "limits"
        ],
        "additionalProperties": false
      },
      "ExecutionSpec": {
        "type": "object",
        "properties": {
          "executionId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "attemptId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "generation": {
            "$ref": "#/components/schemas/Generation"
          },
          "executionBackend": {
            "enum": [
              "customer-host",
              "kubernetes"
            ]
          },
          "runtimeEngine": {
            "enum": [
              "docker",
              "kubernetes"
            ]
          },
          "isolationProfile": {
            "enum": [
              "standard",
              "isolated"
            ]
          },
          "profileVersion": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "templateVersion": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "provider": {
            "enum": [
              "github",
              "azure-devops"
            ]
          },
          "hostPlatform": {
            "$ref": "#/components/schemas/Platform"
          },
          "runnerPlatform": {
            "$ref": "#/components/schemas/Platform"
          },
          "imageDigest": {
            "type": "string",
            "pattern": "^sha256:[a-f0-9]{64}$"
          },
          "trustClass": {
            "enum": [
              "trusted",
              "untrusted"
            ]
          },
          "dockerBuild": {
            "type": "boolean"
          },
          "resources": {
            "$ref": "#/components/schemas/ResourceBudget"
          },
          "policyGeneration": {
            "$ref": "#/components/schemas/Generation"
          },
          "compatibilityRecordId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "authorizationExpiresAt": {
            "$ref": "#/components/schemas/Timestamp"
          },
          "specHash": {
            "$ref": "#/components/schemas/Digest"
          }
        },
        "required": [
          "executionId",
          "attemptId",
          "generation",
          "executionBackend",
          "runtimeEngine",
          "isolationProfile",
          "profileVersion",
          "templateVersion",
          "provider",
          "hostPlatform",
          "runnerPlatform",
          "imageDigest",
          "trustClass",
          "dockerBuild",
          "resources",
          "policyGeneration",
          "compatibilityRecordId",
          "authorizationExpiresAt",
          "specHash"
        ],
        "additionalProperties": false
      },
      "StartCommand": {
        "type": "object",
        "properties": {
          "commandId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "payloadHash": {
            "$ref": "#/components/schemas/Digest"
          },
          "generation": {
            "$ref": "#/components/schemas/Generation"
          },
          "kind": {
            "const": "start"
          },
          "spec": {
            "$ref": "#/components/schemas/ExecutionSpec"
          }
        },
        "required": [
          "commandId",
          "payloadHash",
          "generation",
          "kind",
          "spec"
        ],
        "additionalProperties": false
      },
      "ControlCommand": {
        "type": "object",
        "properties": {
          "commandId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "payloadHash": {
            "$ref": "#/components/schemas/Digest"
          },
          "generation": {
            "$ref": "#/components/schemas/Generation"
          },
          "kind": {
            "enum": [
              "cancel",
              "cleanup"
            ]
          },
          "executionId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          }
        },
        "required": [
          "commandId",
          "payloadHash",
          "generation",
          "kind",
          "executionId"
        ],
        "additionalProperties": false
      },
      "HostCommand": {
        "oneOf": [
          {
            "$ref": "#/components/schemas/StartCommand"
          },
          {
            "$ref": "#/components/schemas/ControlCommand"
          }
        ],
        "discriminator": {
          "propertyName": "kind",
          "mapping": {
            "start": "#/components/schemas/StartCommand",
            "cancel": "#/components/schemas/ControlCommand",
            "cleanup": "#/components/schemas/ControlCommand"
          }
        }
      },
      "CommandAck": {
        "type": "object",
        "properties": {
          "commandId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "payloadHash": {
            "$ref": "#/components/schemas/Digest"
          },
          "generation": {
            "$ref": "#/components/schemas/Generation"
          },
          "acceptance": {
            "const": "durable"
          }
        },
        "required": [
          "commandId",
          "payloadHash",
          "generation",
          "acceptance"
        ],
        "additionalProperties": false
      },
      "StartRequest": {
        "type": "object",
        "properties": {
          "executionId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "attemptId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "generation": {
            "$ref": "#/components/schemas/Generation"
          },
          "commandId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "startRequestId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "specHash": {
            "$ref": "#/components/schemas/Digest"
          },
          "policyGeneration": {
            "$ref": "#/components/schemas/Generation"
          }
        },
        "required": [
          "executionId",
          "attemptId",
          "generation",
          "commandId",
          "startRequestId",
          "specHash",
          "policyGeneration"
        ],
        "additionalProperties": false
      },
      "StartResponse": {
        "type": "object",
        "properties": {
          "issuanceId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "state": {
            "enum": [
              "PENDING",
              "ISSUING",
              "ISSUED",
              "UNCERTAIN",
              "EXPIRED",
              "REVOKED"
            ]
          },
          "bootstrapExpiresAt": {
            "$ref": "#/components/schemas/Timestamp"
          },
          "recoveryExpiresAt": {
            "$ref": "#/components/schemas/Timestamp"
          },
          "encryptedBootstrap": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 65536
          }
        },
        "required": [
          "issuanceId",
          "state"
        ],
        "additionalProperties": false
      },
      "RuntimeObservation": {
        "type": "object",
        "properties": {
          "runtimeRef": {
            "$ref": "#/components/schemas/RuntimeRef"
          },
          "state": {
            "enum": [
              "prepared",
              "running",
              "exited",
              "cleanup-pending",
              "cleaned",
              "unknown"
            ]
          },
          "exitCode": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": -2147483648,
            "maximum": 2147483647
          },
          "observedAt": {
            "$ref": "#/components/schemas/Timestamp"
          }
        },
        "required": [
