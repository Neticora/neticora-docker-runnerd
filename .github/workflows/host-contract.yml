name: Host contract conformance
on:
  pull_request:
    paths: ['api/**', '.github/workflows/host-contract.yml']
  push:
    paths: ['api/**', '.github/workflows/host-contract.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            api/tools/go.sum
            api/protocol/go.sum
            api/conformance/go.sum
      - name: Download pinned validation dependencies
        run: |
          set -euo pipefail
          for module in tools protocol conformance; do
            (cd "api/$module" && go mod download)
          done
          git diff --exit-code -- api
      - name: Verify deterministic Go generation and reject drift offline
        working-directory: api/tools
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          go run -mod=readonly ./cmd/contract
          go test -count=1 -mod=readonly ./...
      - name: Qualify generated models and runtime validation offline
        working-directory: api/protocol
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          go test -count=1 -mod=readonly -race ./...
          go vet -mod=readonly ./...
      - name: Validate canonical schema, hashes and identities offline
        working-directory: api/conformance
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: go test -count=1 -mod=readonly -v ./...
      - name: Verify generation left checkout unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
