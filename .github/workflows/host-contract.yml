name: Host contract conformance
on:
  pull_request:
  push:
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  # SQLite durability tests reject tmpfs/network filesystems. Use local disk.
  TMPDIR: /var/tmp

jobs:
  # Public PR code runs on disposable GitHub-hosted workers, without private
  # platform credentials, Docker management access or customer network access.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-contract
      - run: bash .github/scripts/check-contract.sh lint
      - name: Scan all Go dependency graphs
        run: bash .github/scripts/scan-dependencies.sh

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-contract
      - run: bash .github/scripts/check-contract.sh typecheck

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-contract
      - run: bash .github/scripts/check-contract.sh unit-tests
      - name: Prepare pinned SBOM scanner
        run: bash .github/scripts/prepare-syft.sh "$RUNNER_TEMP/syft"
      - name: Qualify real offline signed foundation artifacts
        run: bash packaging/qualify-foundation.sh "$RUNNER_TEMP/qualification" "$RUNNER_TEMP/syft/syft"

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-contract
      - run: bash .github/scripts/check-contract.sh build

  contract-validation:
    name: contract-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-contract
      - run: bash .github/scripts/check-contract.sh contract-validation

  protocol-conformance:
    name: protocol-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-contract
      - run: bash .github/scripts/check-contract.sh protocol-conformance
