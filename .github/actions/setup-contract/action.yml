name: Prepare host contract toolchain
description: Install the pinned Go toolchain and prepare immutable module caches
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: '1.27.3'
        cache-dependency-path: |
          api/tools/go.sum
          api/protocol/go.sum
          api/conformance/go.sum
    - name: Download pinned dependencies without checksum drift
      shell: bash
      env:
        GOTOOLCHAIN: local
      run: |
        set -euo pipefail
        for module in tools protocol conformance; do
          (cd "api/$module" && go mod download)
        done
        git diff --exit-code -- api
