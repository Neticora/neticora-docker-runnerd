# Optional, dedicated-host drop-in. Install only after reviewing the signed
# profile against these exact customer-provisioned bounded mount points.
# Does not mount filesystems, enable KVM or modify any customer network setting.
[Unit]
Requires=neticora-runnerd-kata-observer.service
After=neticora-runnerd-kata-observer.service

[Service]
# Provision this service-owned private directory with the optional Kata tmpfiles
# fragment first. Match this path when using a custom bootstrapRoot in config.
ReadWritePaths=/run/neticora-runnerd-bootstrap-health
