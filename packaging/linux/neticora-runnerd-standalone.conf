# Explicit qualification-only drop-in for a dedicated lab installation.
# Ordinary Runnerd release binaries reject the standalone lab binding.
[Unit]
Requires=docker.service
After=docker.service

[Service]
User=root
Group=root
PrivateDevices=no
ProtectControlGroups=no
ProtectSystem=no
CapabilityBoundingSet=~
Environment=RUNNERD09_LIVE_QUALIFICATION=1
